<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Rota Trip Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the service (left) and a "behind the scenes" rail (right) that names the core function and who does what at each step. */
:root{
  --bg:#EEF2EF; --surface:#FAFCFA; --sunk:#E3E9E5; --ink:#10232A; --muted:#4D5F64; --line:#CBD5D0;
  --ai:#2D55E0; --ai-soft:#E3E9FD; --you:#C9541A; --you-soft:#FBE7DC; --ok:#1F7A4D; --ok-soft:#DDF1E6;
  --warn:#9A6200; --warn-soft:#FBEFD3; --bad:#B3261E; --bad-soft:#F9E1DF;
  --display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif; --body:'Figtree', 'Segoe UI', Arial, sans-serif; --mono:'JetBrains Mono', Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A1E; --surface:#13252A; --sunk:#0A1518; --ink:#E7EFEC; --muted:#A3B4B6; --line:#2A3F45;
  --ai:#8FA8FF; --ai-soft:#1C2A55; --you:#FF9A62; --you-soft:#4A2614; --ok:#6FD3A0; --ok-soft:#163A2A;
  --warn:#F2C25B; --warn-soft:#3D2E0C; --bad:#FF8A80; --bad-soft:#4A1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1E; --surface:#13252A; --sunk:#0A1518; --ink:#E7EFEC; --muted:#A3B4B6; --line:#2A3F45;
  --ai:#8FA8FF; --ai-soft:#1C2A55; --you:#FF9A62; --you-soft:#4A2614; --ok:#6FD3A0; --ok-soft:#163A2A;
  --warn:#F2C25B; --warn-soft:#3D2E0C; --bad:#FF8A80; --bad-soft:#4A1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.logo i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--you);box-shadow:16px 0 0 var(--ai)}
.logo small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-left:14px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pill.live{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.step:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.btn.you{background:var(--you);border-color:var(--you);color:#fff}
:root[data-theme="dark"] .btn.you{color:#1b0d05}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.you{color:#1b0d05}}
.btn.you::before{content:"You decide · ";font-weight:500;opacity:.85}
.btn.ai{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
nav.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-block:10px 12px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;min-width:0}
.step b{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.step span{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.step.on b{color:var(--surface);opacity:.8}
.step.done span::after{content:" ✓";color:var(--ok)}
.step.on.done span::after{color:var(--surface)}
main.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding-block:20px 80px}
@media (max-width:900px){main.layout{grid-template-columns:minmax(0,1fr)} nav.stepper{grid-template-columns:repeat(4,minmax(0,1fr))} .logo small{display:none}}
@media (max-width:900px){header.top{position:static}}
@media (max-width:480px){nav.stepper{gap:4px} .step{padding:6px 8px} .step span{font-size:13px}}
.app{min-width:0;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700;font-family:var(--body)}
p{margin:0}
.lede{color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ai-made{border-left:4px solid var(--ai)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.tag.ai{background:var(--ai-soft);color:var(--ai)}
.tag.you{background:var(--you-soft);color:var(--you)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.plain{background:var(--sunk);color:var(--muted)}
body.noroles .tag.ai,body.noroles .tag.you,body.noroles .btn.you::before{display:none}
body.noroles .ai-made{border-left-width:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip.on{background:var(--you-soft);border-color:var(--you);color:var(--you);font-weight:700}
.chip.ai{border-color:var(--ai)}
/* feed */
.feed{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.msg.rota{background:var(--ai-soft);color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start}
.msg.rota::before{content:"Rota";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ai);margin-bottom:2px}
.msg.you{background:var(--you-soft);border-bottom-right-radius:4px;align-self:flex-end}
.msg.you::before{content:"You";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--you);margin-bottom:2px}
.typing{align-self:flex-start;background:var(--ai-soft);border-radius:14px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
/* timeline */
.tl{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.blk:first-child{border-top:none}
.blk .t{font-family:var(--mono);font-size:13px;font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums}
.blk .ttl{font-weight:700}
.blk .meta{font-size:13px;color:var(--muted)}
.blk.past{opacity:.5}
.blk.now{background:linear-gradient(90deg,var(--you-soft),transparent);border-radius:6px}
.blk.added{background:var(--ok-soft);border-radius:6px}
.blk.removed{background:var(--bad-soft);border-radius:6px}
.blk.removed .ttl{text-decoration:line-through}
.blk.moved .t{color:var(--you)}
.nowline{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--you);font-weight:600;padding:4px 0}
.nowline::after{content:"";flex:1;height:2px;background:var(--you)}
.conf{font-size:11px}
/* behind the scenes */
.bts{min-width:0;display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
@media (max-width:900px){.bts{position:static}}
.bts .card{padding:14px}
.bts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.bts dt:first-child{margin-top:0}
.bts dd{margin:2px 0 0}
.bts .who-ai{border-left:3px solid var(--ai);padding-left:8px}
.bts .who-you{border-left:3px solid var(--you);padding-left:8px}
.rule{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15}
.rule em{font-style:normal;color:var(--ai)} .rule strong{color:var(--you)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner b{color:var(--warn);white-space:nowrap}
.optcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.optcard.on{border-color:var(--you);box-shadow:0 0 0 2px var(--you)}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--mono);font-weight:600}
ul.why{margin:0;padding-left:18px;font-size:14px}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:none}
.check input{width:20px;height:20px;accent-color:var(--you);margin-top:2px}
.small{font-size:13px;color:var(--muted)}
a{color:var(--ai)}
pre.draft{white-space:pre-wrap;font-family:var(--body);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;margin:8px 0 0;font-size:14px}
.diff{display:flex;flex-direction:column;gap:6px}
.diff div{font-size:14px;padding:6px 10px;border-radius:6px}
.diff .rm{background:var(--bad-soft)} .diff .ad{background:var(--ok-soft)} .diff .mv{background:var(--you-soft)} .diff .nt{background:var(--sunk)}
.story p{margin-bottom:10px;max-width:65ch}
.para{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.para.off p{opacity:.4;text-decoration:line-through}
.share{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:20px}
.share h3{font-family:var(--display);font-size:22px;margin-bottom:8px}
.share p{opacity:.9;margin-bottom:8px;font-size:14px}
/* wizard */
.wizard{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));z-index:20;background:var(--surface);border:2px solid var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}
.wizard h3{font-family:var(--display);font-size:18px}
.wz-pending{background:var(--you-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100vw - 32px)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
</style>

<header class="top">
  <div class="wrap">
    <div class="topin">
      <div class="logo"><i aria-hidden="true"></i><span style="margin-left:14px">Rota</span><small>A trip planner that adapts with you · 2026 prototype</small></div>
      <div class="spacer"></div>
      <span id="modePill" class="pill">Scripted demo</span>
      <button id="liveBtn" class="btn ghost" hidden>Use live AI</button>
      <button id="rolesBtn" class="btn ghost" aria-pressed="true">Roles: on</button>
      <button id="wizBtn" class="btn ghost" title="Wizard of Oz console (W)">Wizard <span class="kbd">W</span></button>
      <button id="resetBtn" class="btn ghost">Restart</button>
    </div>
    <nav class="stepper" id="stepper" aria-label="Journey steps"></nav>
  </div>
</header>

<main class="wrap layout">
  <section class="app" id="app" aria-live="polite"></section>
  <aside class="bts" id="bts" aria-label="Behind the scenes"></aside>
</main>

<div class="wizard" id="wizard" hidden>
  <div class="row"><h3>Wizard of Oz console</h3><div class="spacer"></div><button class="btn ghost" id="wizClose">Close</button></div>
  <p class="small">A teammate plays Rota here. Messages appear in the traveler's view as if the AI wrote them.</p>
  <div id="wzPending"></div>
  <div><label for="wzText">Type Rota's reply</label><textarea id="wzText" placeholder="e.g. Got it. Rain from 13:00 — I'd swap the park for a museum. Want to see the plan?"></textarea></div>
  <div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500"><input type="checkbox" id="wzTyping" checked> Show typing first</label><div class="spacer"></div><button class="btn ai" id="wzSend">Send as Rota</button></div>
  <div><label>Trigger a disruption on screen</label><div class="row" id="wzTriggers"></div></div>
  <div><label>Jump to step</label><div class="row" id="wzJump"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v; // only used with static strings written in this file
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const toMin = t => { const [a,b] = t.split(":").map(Number); return a*60+b; };
const toHM = m => String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
let toastTimer;
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const ta=h("textarea",{style:"position:fixed;opacity:0"}); ta.value=text; document.body.append(ta); ta.select(); try{document.execCommand("copy"); toast("Copied");}catch{toast("Select the text and copy it");} ta.remove(); }
}
const gsearch = q => "https://www.google.com/search?q=" + encodeURIComponent(q);
const gmap = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + ", Rio de Janeiro");

// ---------- content ----------
const STEPS = [
 {id:"brief", name:"Brief", core:"Understand what the traveler wants",
  ai:"Asks three follow-up questions (must-sees, early starts, rain preference) and writes back a summary of the brief.",
  you:"Fills in the brief, answers the questions, corrects the summary and confirms it.",
  data:"Only what the traveler types: dates, people, budget, interests, pace and limits.",
  sim:"Follow-up questions are pre-written in scripted mode; written by Claude in live AI mode."},
 {id:"propose", name:"Propose", core:"Propose a route and places",
  ai:"Drafts three different itineraries and explains why each one fits this brief.",
  you:"Picks one option (or goes back and changes the brief).",
  data:"The confirmed brief and the model's general knowledge of Rio.",
  sim:"Scripted mode shows sample itineraries written for the example traveler (and says so if you changed the brief). Live AI mode writes three new ones from your brief."},
 {id:"check", name:"Check", core:"Handle logistics: verify",
  ai:"Lists every assumption in the plan (hours, prices, days a place runs) with how sure it is.",
  you:"Checks each flagged item on an official source and marks it verified.",
  data:"The chosen plan. The search links open in the traveler's own browser.",
  sim:"Confidence levels are pre-set. Links are real searches."},
 {id:"book", name:"Book", core:"Handle logistics: book",
  ai:"Builds the booking checklist, drafts reservation messages in Portuguese and a calendar file.",
  you:"Books and pays on the official sites, sends the messages, ticks what is done.",
  data:"The plan plus the traveler's name and party size.",
  sim:"Nothing is booked or paid. The calendar file and copied messages are real."},
 {id:"travel", name:"Travel", core:"Adapt when things change: during the trip",
  ai:"Shows today's plan, what is next and how long until it starts.",
  you:"Follows the plan, skips a stop or reports that something changed.",
  data:"Today's plan and the phone's clock.",
  sim:"\"Now\" is fixed at 12:40 on Saturday 14 Nov for the demo."},
 {id:"adapt", name:"Adapt", core:"Adapt when things change",
  ai:"Proposes a new version of the day, with its reason, its assumptions and what it cannot know.",
  you:"Approves, rejects or asks for another option. Nothing changes without approval.",
  data:"What the traveler reports plus today's plan. No live weather, queues or closures.",
  sim:"Quick disruptions use rules written for the demo; \"Describe what changed\" uses live AI or the Wizard."},
 {id:"remember", name:"Remember", core:"Keep memories",
  ai:"Turns the traveler's own notes into a short trip story.",
  you:"Chooses which paragraphs to keep and whether to share the story.",
  data:"Only the notes the traveler writes.",
  sim:"The story is pre-written in scripted mode; written by Claude in live AI mode."}
];

const DAYS = [
  {key:"d1", label:"Fri 13 Nov", date:"20261113"},
  {key:"d2", label:"Sat 14 Nov", date:"20261114"},
  {key:"d3", label:"Sun 15 Nov", date:"20261115"}
];
// conf: known | check | unsure ; outdoor, fixed (time tied to nature), book (needs ticket/reservation)
const B = (id,time,title,area,kind,est,conf,verify,extra={}) => ({id,time,title,area,kind,est,conf,verify,...extra});
const OPTIONS = [
 {id:"postcard", name:"Postcard Rio", line:"The famous views, one per half-day.",
  stops:"4 a day", walk:"Medium", spend:"≈ R$ 1,650 for two",
  why:["Both must-sees you named, on clear mornings","Train to the Christ instead of the trail (Leo's knee)","Leaves little room for food stops"],
  days:{
   d1:[B("p11","09:00","Escadaria Selarón","Lapa","see","Free","known","Best before crowds; go in daylight",{outdoor:1}),
       B("p12","11:00","Museu do Amanhã","Praça Mauá","see","≈ R$ 30 pp","check","Opening days and ticket price"),
       B("p13","13:30","Lunch at Confeitaria Colombo","Centro","eat","≈ R$ 90 pp","check","Lunch hours"),
       B("p14","17:00","Sunset at Mureta da Urca","Urca","see","≈ R$ 40 pp","known","Sunset time",{outdoor:1,fixed:1})],
   d2:[B("p21","08:00","Christ the Redeemer by Trem do Corcovado","Cosme Velho","see","≈ R$ 100+ pp","check","Timed ticket; summit may be in cloud",{outdoor:1,book:1}),
       B("p22","12:00","Lunch in Botafogo","Botafogo","eat","≈ R$ 70 pp","unsure","Rota did not pick a specific place"),
       B("p23","14:30","Copacabana promenade","Copacabana","see","Free","known","",{outdoor:1}),
       B("p24","17:30","Sunset at Arpoador","Arpoador","see","Free","known","Sunset time",{outdoor:1,fixed:1}),
       B("p25","20:30","Dinner in Ipanema","Ipanema","eat","≈ R$ 150 pp","check","Reservation needed",{book:1})],
   d3:[B("p31","09:00","Jardim Botânico","Jardim Botânico","see","≈ R$ 70 pp","check","Holiday hours (15 Nov)",{outdoor:1}),
       B("p32","12:30","Lunch in Leblon","Leblon","eat","≈ R$ 90 pp","unsure","Rota did not pick a specific place"),
       B("p33","15:30","Sugarloaf cable car","Urca","see","≈ R$ 200 pp","check","Ticket price and last car",{outdoor:1,book:1}),
       B("p34","19:30","Dinner in Urca","Urca","eat","≈ R$ 120 pp","unsure","")]}},
 {id:"local", name:"Rio like a local", line:"Neighborhoods, food and one big view a day.",
  stops:"5–6 a day", walk:"Medium, no steep trails", spend:"≈ R$ 1,750 for two",

function normalizeOptions(res){

  return list.slice(0,3).map((o,i)=>{
    const id = "ai"+i, days = {};
    DAYS.forEach((d,j)=>{
      const raw = (o && o.days && (o.days[d.key] || o.days[j])) || [];
      days[d.key] = (Array.isArray(raw) ? raw : []).slice(0,7).map((b,k)=>({
        id:id+d.key+"_"+k, time:hhmm(b&&b.time)||toHM(540+k*120), title:String((b&&b.title)||"Stop"), area:String((b&&b.area)||""),
        kind:KINDS.includes(b&&b.kind)?b.kind:"see", est:String((b&&b.est)||"Check"), conf:CONF.includes(b&&b.conf)?b.conf:"check",
        verify:String((b&&b.verify)||""), outdoor:!!(b&&b.outdoor), fixed:!!(b&&b.fixed), book:!!(b&&b.book)

  }).filter(o=>DAYS.every(d=>o.days[d.key].length));
}

$("#liveBtn").onclick = ()=>{ live=!live; $("#modePill").textContent= live?"Live AI on":"Scripted demo"; $("#modePill").classList.toggle("live",live); $("#liveBtn").textContent = live?"Use scripted demo":"Use live AI"; render(); toast(live?"Live AI on: Claude answers (asks your permission first)":"Scripted demo"); };
initWizard();
// deep links for screenshots and rehearsals: #brief … #remember, plus #adapt-rain and #remember-story
(function fromHash(){
  const t = (location.hash||"").slice(1); if(!t) return;
  const [step, extra] = t.split("-");
  if (!STEPS.some(s=>s.id===step)) return;
  if (step!=="brief"){ S.plan=planFor(S.option); S.briefSent=true; S.briefOk=true; FOLLOWUPS.forEach((f,i)=>S.answers[i]=f.opts[0]); STEPS.slice(0,STEPS.findIndex(s=>s.id===step)).forEach(s=>S.done[s.id]=true); }
  if (step==="check"){ ["l11","l12","l21","l23"].forEach(id=>S.verified[id]=true); }
  if (step==="book" || step==="travel" || step==="adapt"){ ["l11","l12","l21","l23"].forEach(id=>S.verified[id]=true); S.booked.l21=true; }
  if (step==="brief" && extra==="asked"){ S.briefSent=true; S.feeds.brief.push({who:"you",text:"Here's my trip: Rio de Janeiro, Fri 13 – Sun 15 Nov 2026, 2 adults (Ana and Leo). Budget R$ 1,800 for two. Pace: Balanced."},{who:"rota",text:"Thanks! Three quick questions so I don't guess."}); S.answers={0:"Christ + Sugarloaf",1:"Fine before 8am"}; }
  S.step=step;
  if (step==="adapt" && extra){ const r=RULES[extra]; if(r){ S.feeds.adapt.push({who:"you",text:r.you}); const res=r.make(S.plan.d2); S.proposal={...res,kind:extra,label:r.label}; S.feeds.adapt.push({who:"rota",text:res.reason}); } }
  if (step==="remember" && extra==="story"){ S.story=SCRIPTED_STORY; S.keep={3:true}; }
})();
render();
(async ()=>{ try{ if (window.claude){ sample = await window.claude.use("sample"); if (sample){ $("#liveBtn").hidden=false; } } }catch{} })();
})();
</script>
</body></html>
